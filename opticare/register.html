<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account - OptiCare</title>
  <meta name="description" content="Create your free OptiCare account.">
  <link rel="canonical" href="https://www.opticare.com/register">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/google-fonts.css">
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/flatpickr.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/minimal-navbar.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/flatpickr-dark.css">
</head>
<body class="auth-page">

  <!-- ======= Centered Auth Layout ======= -->
  <div class="auth-wrap">
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-logo text-center">
          <a class="site-logo" href="index.html" aria-label="OptiCare home">
            <img src="assets/images/logo/logo.png?v=3" alt="OptiCare logo">
          </a>
        </div>
        <div class="auth-heading text-center">
          <h1>Create an Account</h1>
          <p class="text-muted">Join OptiCare in under a minute — it's free.</p>
        </div>
        <form novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="regFname">First Name</label>
              <input type="text" class="form-control" id="regFname" placeholder="Your first name" aria-label="First name">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regLname">Last Name</label>
              <input type="text" class="form-control" id="regLname" placeholder="Your last name" aria-label="Last name">
            </div>
            <div class="col-12">
              <label class="form-label" for="regEmail">Email Address</label>
              <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" aria-label="Email address">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regPhone">Phone</label>
              <input type="tel" class="form-control" id="regPhone" placeholder="+91 ..." aria-label="Phone">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regDob">Date of Birth</label>
              <input type="text" class="form-control" id="regDob" placeholder="DD-MM-YYYY" aria-label="Date of birth">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regPassword">Password</label>
              <input type="password" class="form-control" id="regPassword" placeholder="Create a password" aria-label="Password">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regConfirm">Confirm Password</label>
              <input type="password" class="form-control" id="regConfirm" placeholder="Repeat password" aria-label="Confirm password">
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="regTerms" checked>
                <label class="form-check-label small" for="regTerms">I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a></label>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100 py-2">Create Account <i class="bi bi-arrow-right"></i></button>
            </div>
          </div>
        </form>
        <div class="divider-text">or sign up with</div>
        <div class="d-flex flex-column gap-3">
          <a href="https://accounts.google.com/o/oauth2/v2/auth"
             class="social-btn w-100"
             id="googleSignupBtn"
             data-oauth-provider="google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </a>
          <a href="https://appleid.apple.com/auth/authorize"
             class="social-btn w-100"
             id="appleSignupBtn"
             data-oauth-provider="apple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.52-3.23 0-1.44.65-2.2.47-3.06-.4C3.79 16.17 4.36 9.02 8.98 8.76c1.32.07 2.24.74 3.03.78.98-.2 1.93-.86 2.93-.78 1.24.1 2.17.65 2.8 1.64-2.61 1.56-1.99 4.98.39 5.94-.48 1.26-1.1 2.52-2.08 3.94zM12.03 8.57c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Continue with Apple
          </a>
        </div>
        <p class="text-center mt-4 mb-0">Already have an account? <a href="login.html" class="fw-semibold text-primary">Sign in</a></p>
        <div class="text-center mt-4 pt-3 border-top">
          <a href="index.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to OptiCare Home</a>
        </div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/swiper-bundle.min.js"></script>
  <script src="assets/js/flatpickr.min.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/oauth.js"></script>
</body>
</html>
