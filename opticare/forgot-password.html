<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - OptiCare</title>
  <meta name="description" content="Reset your OptiCare account password.">
  <link rel="canonical" href="https://www.opticare.com/forgot-password">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/google-fonts.css">
  <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
  <link rel="stylesheet" href="assets/css/flatpickr.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/flatpickr-dark.css">
</head>
<body class="auth-page">

  <!-- ======= Centered Auth Layout ======= -->
  <div class="auth-wrap">
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-logo text-center">
          <a class="site-logo" href="index.html" aria-label="OptiCare home">
            <img src="assets/images/logo/logo.png" alt="OptiCare logo">
          </a>
        </div>
        <div class="auth-heading text-center">
          <span class="icon-box mb-3"><i class="bi bi-key"></i></span>
          <h1>Forgot Password?</h1>
          <p class="text-muted">Enter your email and we'll send you a reset link.</p>
        </div>
        <form novalidate>
          <div class="mb-4">
            <label class="form-label" for="fpEmail">Email Address</label>
            <input type="email" class="form-control" id="fpEmail" placeholder="you@example.com" aria-label="Email address">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link <i class="bi bi-send"></i></button>
        </form>
        <div class="d-flex justify-content-between mt-4">
          <a href="login.html" class="fw-semibold text-primary"><i class="bi bi-arrow-left"></i> Back to login</a>
          <a href="register.html" class="fw-semibold text-primary">Create account</a>
        </div>
        <div class="text-center mt-4 pt-3 border-top">
          <a href="index.html" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to OptiCare Home</a>
        </div>
      </div>
    </main>
  </div>

  <!-- JS -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/swiper-bundle.min.js"></script>
  <script src="assets/js/flatpickr.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
